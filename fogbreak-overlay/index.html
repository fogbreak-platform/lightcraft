<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <title>Fogbreak Light</title>
  <link data-trunk rel="rust" href="Cargo.toml" data-bin="fogbreak-light" data-wasm-opt="z" data-weak-refs />
  <style>
    :root {
      --bg-canvas: #F7FAFC;
      --bg-panel: #FFFFFF;
      --text-primary: #111821;
      --text-muted: #526275;
      --accent: #087F9C;
      --border: #CBD5E1;
    }
    @media (prefers-color-scheme: dark) {
      :root:not([data-theme="light"]) {
        --bg-canvas: #111821;
        --bg-panel: #18222E;
        --text-primary: #F7FAFC;
        --text-muted: #94A3B8;
        --accent: #087F9C;
        --border: #2B394B;
      }
    }
    html[data-theme="dark"] {
      --bg-canvas: #111821;
      --bg-panel: #18222E;
      --text-primary: #F7FAFC;
      --text-muted: #94A3B8;
      --accent: #087F9C;
      --border: #2B394B;
    }
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      overscroll-behavior: none;
      background: var(--bg-canvas);
      color: var(--text-primary);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    #fogbreak_canvas {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      display: block;
      outline: none;
      touch-action: none;
    }
    #fogbreak_loading, #fogbreak_error {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 12px;
      background: var(--bg-canvas);
      color: var(--text-primary);
      z-index: 10;
    }
    #fogbreak_loading[hidden], #fogbreak_error[hidden] {
      display: none;
    }
    .fogbreak-spinner {
      width: 28px;
      height: 28px;
      border: 3px solid var(--border);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: fogbreak-spin 0.8s linear infinite;
    }
    .fogbreak-error-card {
      max-width: 460px;
      padding: 20px 24px;
      border-radius: 10px;
      background: var(--bg-panel);
      border: 1px solid var(--border);
      text-align: center;
    }
    @keyframes fogbreak-spin {
      to { transform: rotate(360deg); }
    }
  </style>
  <script>
    (function () {
      var params = new URLSearchParams(window.location.search);
      var q = params.get("theme");
      var dark = q === "dark" || (q !== "light" && window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches);
      document.documentElement.setAttribute("data-theme", dark ? "dark" : "light");
    })();
  </script>
</head>
<body>
  <canvas id="fogbreak_canvas" data-host="page" data-engine="fogbreak-light" data-rpc-key="fogbreakLightHost" data-iframe="false"></canvas>
  <div id="fogbreak_loading">
    <div class="fogbreak-spinner"></div>
    <div style="font-size: 13px; color: var(--text-muted);">Loading Fogbreak Light&hellip;</div>
  </div>
  <div id="fogbreak_error" hidden>
    <div class="fogbreak-error-card">
      <div style="font-weight: 600; margin-bottom: 6px;">Unable to start Fogbreak Light</div>
      <div id="fogbreak_error_message" style="font-size: 13px; color: var(--text-muted);"></div>
    </div>
  </div>
</body>
</html>
